name: prices

on:
  schedule:
    # দিনে ৬ বার (UTC-তে ০, ৪, ৮, ১২, ১৬, ২০টার ১৭ মিনিটে = বাংলাদেশে ভোর ৬টা থেকে প্রতি ৪ ঘণ্টায়)
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker -- prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # "off" দিলে যাচাই বাকি থেকে AI নিজে সিদ্ধান্ত নেয় না
          AUTO_REVIEW: ${{ vars.AUTO_REVIEW }}
