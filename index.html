<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>রাতজাগা — এখন যা খোলা</title>
<meta name="description" content="জরুরি প্রয়োজনীয় জায়গা — ফোনে যাচাই করা, কমিউনিটি-নিশ্চিত, সম্পূর্ণ বাংলায়।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --accent:#f5b841; --radius:14px;
  --bg:#0b1120; --panel:#0f172a; --surf:#16203a; --surf2:#1d2a4d;
  --line:#26355c; --text:#e9eefb; --dim:#a5b1d0; --faint:#6d7ba0;
  --open:#34d399; --closed:#f87171; --warn:#fbbf24; --sos:#dc2626;
  --callgrad:linear-gradient(135deg,#2fd670,#16a34a);
  --glass:rgba(13,20,38,.82);
  --rail:64px; --panel:400px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; overflow:hidden; display:flex; flex-direction:column; height:100dvh;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
a{color:inherit; text-decoration:none;}
h4{font-weight:600;}
.app{display:flex; flex:1; min-height:0;}
/* ---------- sidebar ---------- */
.sidebar{width:64px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:14px 0 12px; gap:8px;}
.brand-tile{width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg,#f7c65a,#e08f2e); display:flex; align-items:center; justify-content:center; color:#241804; box-shadow:0 0 20px rgba(245,184,65,.3); flex:none;}
.nav{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
.nav button{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--faint); padding:0;}
.nav button:hover{color:var(--text); background:var(--surf);}
.nav button[aria-pressed="true"]{color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);}
.sidebar-sp{flex:1;}
.sos{display:flex; align-items:center; justify-content:center; background:var(--sos); color:#fff; border-radius:50%; width:42px; height:42px; box-shadow:0 6px 18px rgba(220,38,38,.35);}
.login{display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--dim); width:42px; height:38px; border-radius:10px; padding:0;}
.login:hover{color:var(--text); border-color:var(--accent);}
/* ---------- main ---------- */
.main{flex:1; min-width:0; display:flex;}
.panel{width:400px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--bg); min-width:0;}
.searchwrap{position:relative; padding:14px 16px 4px;}
.searchwrap input{width:100%; background:var(--surf); border:1px solid var(--line); border-radius:12px; color:var(--text); padding:11px 14px 11px 40px; font-size:14px; outline-offset:2px; transition:border-color .15s, box-shadow .15s;}
.searchwrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.searchwrap .sico{position:absolute; left:28px; top:26px; transform:translateY(-50%); color:var(--faint); display:flex;}
.catrail{display:flex; gap:7px; overflow-x:auto; padding:10px 16px 4px; scrollbar-width:none;}
.catrail::-webkit-scrollbar{display:none;}
.cat-chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surf); border-radius:999px; padding:6px 12px; font-size:12.5px; color:var(--dim); white-space:nowrap; flex:none;}
.cat-chip .cd{width:20px; height:20px; border-radius:6px; background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--c); display:flex; align-items:center; justify-content:center; flex:none;}
.cat-chip .cd svg{width:12px; height:12px;}
.cat-chip[aria-pressed="true"]{border-color:var(--c); color:var(--text); background:color-mix(in srgb, var(--c) 13%, var(--surf));}
.cat-chip .cn{color:var(--open); font-size:11px;}
.filters{display:flex; align-items:center; gap:10px; padding:10px 16px 8px; flex-wrap:wrap;}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; position:relative;}
.switch input{position:absolute; opacity:0; width:1px; height:1px;}
.track{width:36px; height:21px; border-radius:11px; background:#2c3a68; position:relative; transition:background .15s; flex:none;}
.track::after{content:""; position:absolute; top:3px; left:3px; width:15px; height:15px; border-radius:50%; background:#cbd5f0; transition:transform .15s, background .15s;}
.switch input:checked + .track{background:var(--accent);}
.switch input:checked + .track::after{transform:translateX(15px); background:#241804;}
.switch input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px;}
.seg{display:inline-flex; background:var(--surf); border:1px solid var(--line); border-radius:10px; padding:2px; margin-left:auto;}
.seg button{border-radius:8px; padding:4px 11px; font-size:12px; color:var(--dim);}
.seg button[aria-pressed="true"]{background:var(--surf2); color:var(--accent);}
.sec{display:flex; align-items:center; gap:7px; padding:6px 16px 8px; color:var(--dim); font-size:12.5px;}
.sec b{color:var(--text); font-weight:600;}
.list{list-style:none; overflow-y:auto; flex:1; padding:2px 14px 20px; display:flex; flex-direction:column; gap:8px; scrollbar-width:none;}
.list::-webkit-scrollbar{display:none;}
.card{display:flex; gap:11px; align-items:center; background:var(--surf); border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px; cursor:pointer; transition:border-color .12s, background .12s;}
.card:hover{border-color:#33456f; background:var(--surf2);}
.card.is-sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.ic{width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--c); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);}
.cm{flex:1; min-width:0;}
.cm h4{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sub{color:var(--faint); font-size:11px;}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; border-radius:999px; padding:2px 9px; margin-top:4px; background:color-mix(in srgb, currentColor 10%, transparent); width:max-content; max-width:100%;}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
.st-open{color:var(--open);} .st-closed{color:var(--closed);} .st-warn{color:var(--warn);}
.meta{display:flex; align-items:center; gap:5px; flex-wrap:wrap; color:var(--faint); font-size:10.5px; margin-top:4px;}
.meta span{display:inline-flex; align-items:center; gap:3px;}
.ver{color:var(--dim);}
.stale{color:var(--warn); border:1px solid rgba(251,191,36,.4); border-radius:6px; padding:0 5px; font-size:10px;}
.cright{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none;}
.dist{font-size:11px; color:var(--dim); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 9px; display:inline-flex; gap:4px; align-items:center;}
.callbtn{background:var(--callgrad); color:#fff; border-radius:10px; padding:7px 13px; display:inline-flex; align-items:center; gap:6px; font-weight:500; box-shadow:0 4px 12px rgba(34,197,94,.22);}
.callbtn:hover{filter:brightness(1.07);}
.mini{display:flex; gap:4px;}
.ib{border:1px solid var(--line); border-radius:8px; width:29px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--dim);}
.ib:hover{color:var(--text); border-color:var(--accent);}
.empty{color:var(--faint); padding:18px 6px; font-size:13px;}
.empty-act{color:var(--accent); font-size:12.5px; text-decoration:underline; margin-left:4px;}
.foot-note{color:var(--faint); font-size:10.5px; padding:8px 16px 12px; border-top:1px solid var(--line); display:flex; gap:6px; align-items:center;}
/* ---------- map ---------- */
.mapwrap{flex:1; position:relative; min-width:0; background:#0d1428;}
#map{position:absolute; inset:0; background:#0d1428;}
.leaflet-container{background:#0d1428; font-family:inherit;}
.rj-osmfilter .leaflet-tile-pane{ filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.55); }
.leaflet-bar a{background:var(--panel) !important; color:var(--text) !important; border-color:var(--line) !important;}
.leaflet-bar a:hover{background:var(--surf2) !important;}
.leaflet-control-attribution{background:rgba(11,17,32,.8) !important; color:var(--faint) !important; font-size:9.5px !important;}
.leaflet-control-attribution a{color:var(--dim) !important;}
.mk{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--c); color:#fff; border:2px solid rgba(255,255,255,.92); box-shadow:0 3px 10px rgba(0,0,0,.5); transition:opacity .15s, transform .15s;}
.mk.is-closed{opacity:.42;}
.mk.is-sel{transform:scale(1.18); box-shadow:0 0 0 3px var(--accent), 0 6px 16px rgba(0,0,0,.5);}
.mk svg{width:15px; height:15px;}
.me-dot{width:14px; height:14px; border-radius:50%; background:#60a5fa; border:3px solid #dbeafe; box-shadow:0 0 0 4px rgba(96,165,250,.25), 0 0 14px rgba(96,165,250,.6);}
.mappill{position:absolute; top:12px; left:56px; z-index:500; background:var(--glass); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.09); border-radius:999px; padding:5px 12px; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px;}
.mappill b{color:var(--open);}
.locbtn{position:absolute; right:12px; bottom:96px; z-index:500; width:40px; height:40px; border-radius:50%; background:var(--glass); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.09); color:var(--dim); display:flex; align-items:center; justify-content:center;}
.locbtn:hover{color:var(--text);}
.mapfail{position:absolute; inset:0; z-index:600; background:rgba(11,17,32,.93); display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--dim); text-align:center; padding:20px;}
.mapfail.show{display:flex;}
.mapfail b{color:var(--text); font-size:15px; display:block;}
.mapfail svg{width:28px; height:28px; color:var(--warn);}
/* ---------- detail panel ---------- */
.detail{position:fixed; left:calc(var(--rail) + var(--panel) + 14px); bottom:14px; width:360px; max-width:calc(100vw - var(--rail) - var(--panel) - 28px); background:var(--glass); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:14px; z-index:1000; display:none; box-shadow:0 16px 44px rgba(0,0,0,.45);}
.detail.show{display:block;}
.dclose{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:8px; color:var(--dim); display:flex; align-items:center; justify-content:center;}
.dback{display:none;}
.dclose:hover{color:var(--text); background:var(--surf);}
.dhead{display:flex; gap:11px; align-items:center; padding-right:24px;}
.dhead .ic{width:44px; height:44px;}
.dcat{font-size:11px; color:var(--c);}
.dhead h3{font-size:15px; line-height:1.35;}
.dsub{color:var(--faint); font-size:11px;}
.dstatus{border-radius:11px; padding:9px 12px; display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; background:color-mix(in srgb, currentColor 10%, transparent); border:1px solid color-mix(in srgb, currentColor 35%, transparent); width:max-content; max-width:100%;}
.dkv{display:flex; gap:8px; margin-top:8px; color:var(--dim); font-size:12px; align-items:flex-start;}
.dkv svg{flex:none; margin-top:2px; color:var(--faint);}
.dcall{display:flex; align-items:center; justify-content:center; gap:8px; background:var(--callgrad); color:#fff; border-radius:12px; padding:12px; font-size:14.5px; font-weight:600; margin-top:11px; box-shadow:0 6px 16px rgba(34,197,94,.3);}
.ddir{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:color-mix(in srgb, #60a5fa 15%, var(--surf)); color:#93c5fd; border:1px solid color-mix(in srgb, #60a5fa 40%, transparent); border-radius:12px; padding:10px; font-size:13.5px; font-weight:500; margin-top:8px;}
.ddir:hover{filter:brightness(1.1);}
.drow{display:flex; gap:8px; margin-top:8px;}
.drow button{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--dim); font-size:12px;}
.drow button:hover{color:var(--text); border-color:var(--accent);}
.dhist{border-top:1px dashed var(--line); margin-top:10px; padding-top:9px; display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--dim);}
.dhist span{display:flex; gap:6px; align-items:center;}
/* ---------- toast ---------- */
.toast{position:fixed; bottom:18px; left:50%; transform:translate(-50%, 10px); background:#101a36; border:1px solid var(--accent); color:var(--text); border-radius:12px; padding:9px 16px; font-size:13px; opacity:0; transition:opacity .18s, transform .18s; pointer-events:none; z-index:1200; max-width:92vw; text-align:center;}
.toast.show{opacity:1; transform:translate(-50%, 0);}
/* ---------- mobile ---------- */
.mhead{display:none;}
.tabs{display:none;}
@media (max-width:880px){
  :root{--rail:0px; --panel:0px;}
  .app{flex-direction:column;}
  .main{flex:1; min-height:0; width:100%;}
  .sidebar{display:none;}
  .mhead{display:flex; align-items:center; gap:9px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex:none;}
  .mhead .brand-tile{width:30px; height:30px; border-radius:9px;}
  .mhead b{font-size:15px;}
  .mhead .sos{width:auto; padding:6px 12px; font-size:12px;}
  .main{flex-direction:column;}
  .panel{width:100%; border-right:none; flex:1; min-height:0;}
  .mapwrap{flex:1; display:none;}
  body[data-view="map"] .panel{display:none;}
  body[data-view="map"] .mapwrap{display:block;}
  .detail{left:0; right:0; top:0; bottom:0; width:auto; max-width:none; max-height:none; border:none; border-radius:0; overflow-y:auto; padding:14px 14px calc(18px + env(safe-area-inset-bottom)); z-index:1100;}
  .dback{display:inline-flex; align-items:center; gap:4px; color:var(--dim); font-size:13.5px; margin-bottom:10px;}
  .dclose{display:none;}
  .tabs{display:flex; border-top:1px solid var(--line); background:var(--panel); z-index:900; flex:none; padding-bottom:env(safe-area-inset-bottom);}
  .tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 9px; color:var(--faint); font-size:10.5px;}
  .tabs button[aria-pressed="true"]{color:var(--accent);}
}
@media (max-width:400px){
  .searchwrap{padding:12px 12px 2px;}
  .searchwrap .sico{left:24px;}
  .catrail{padding:10px 12px 4px;}
  .filters{padding:10px 12px 6px;}
  .sec{padding:6px 12px 8px;}
  .list{padding:2px 12px 20px;}
  .foot-note{padding:8px 12px 12px;}
  .callbtn{padding:7px 10px;}
  .card{padding:10px;}
}
@media (min-width:881px) and (max-width:1080px){ .panel{width:340px;} :root{--panel:340px;} }
</style>
</head>
<body data-view="home">
<div class="app">
  <aside class="sidebar" aria-label="নেভিগেশন">
    <span class="brand-tile"><i data-lucide="moon"></i></span>
    <nav class="nav">
      <button data-nav="home" aria-pressed="true" type="button" title="হোম"><i data-lucide="house"></i></button>
      <button data-nav="map" aria-pressed="false" type="button" title="ম্যাপ ভিউ"><i data-lucide="map"></i></button>
      <button data-nav="saved" type="button" title="সেভ করা জায়গা (শীঘ্রই)"><i data-lucide="bookmark"></i></button>
      <button data-nav="reports" type="button" title="আমার রিপোর্ট (শীঘ্রই)"><i data-lucide="flag"></i></button>
    </nav>
    <div class="sidebar-sp"></div>
    <a class="sos" href="tel:999" title="৯৯৯ জরুরি সেবা"><i data-lucide="phone"></i></a>
    <button class="login" type="button" title="লগইন" data-toast="লগইন ও এন্ট্রি সাবমিশন — পরের ধাপে আসছে (কমিউনিটি ফেজ)।"><i data-lucide="log-in"></i></button>
  </aside>

  <div class="main">
    <section class="panel">
      <header class="mhead">
        <span class="brand-tile"><i data-lucide="moon"></i></span>
        <b>রাতজাগা</b>
        <span style="flex:1"></span>
        <a class="sos" href="tel:999">৯৯৯</a>
      </header>
      <div class="searchwrap">
        <span class="sico"><i data-lucide="search"></i></span>
        <input id="q" type="text" placeholder="ফার্মেসি, এলাকা বা নাম লিখুন…" aria-label="খুঁজুন">
      </div>
      <div class="catrail" id="catrail" role="group" aria-label="ক্যাটাগরি"></div>
      <div class="filters">
        <label class="switch"><input type="checkbox" id="openOnly" checked><span class="track"></span></label>
        <span style="font-size:13px; font-weight:500;">“এখন খোলা”</span>
        <div class="seg" role="group" aria-label="সাজানোর ভিত্তি">
          <button data-sort="dist" aria-pressed="true" type="button">কাছের আগে</button>
          <button data-sort="ver" aria-pressed="false" type="button">নতুন যাচাই</button>
        </div>
      </div>
      <div class="sec"><i data-lucide="map-pin"></i><span id="seclab"></span></div>
      <ul class="list" id="list" aria-label="জায়গার তালিকা"></ul>
      <div class="foot-note"><i data-lucide="info"></i>ডেমো ডেটা (ঢাকা) — আসল সংস্করণে OSM + ফোন-যাচাই + কমিউনিটি রিপোর্ট।</div>
    </section>

    <section class="mapwrap">
      <div id="map" role="application" aria-label="লাইভ ম্যাপ"></div>
      <div class="mappill"><i data-lucide="map-pin"></i>ঢাকা · <b id="openCount"></b> এখন খোলা</div>
      <button class="locbtn" id="locbtn" type="button" aria-label="আমার লোকেশন" data-tooltip="আমার লোকেশন"><i data-lucide="locate-fixed"></i></button>
      <div class="mapfail" id="mapfail"><i data-lucide="wifi-off"></i><div><b>ম্যাপ লোড করা যায়নি</b><span>ইন্টারনেট সংযোগ বা নেটওয়ার্ক-ব্লক চেক করুন। তালিকা, কল ও দিক-দেখানো কাজ করছে।</span></div></div>
    </section>
  </div>
  <nav class="tabs" aria-label="ভিউ">
    <button data-tab="home" aria-pressed="true" type="button"><i data-lucide="list"></i>হোম</button>
    <button data-tab="map" aria-pressed="false" type="button"><i data-lucide="map"></i>ম্যাপ</button>
  </nav>
</div>

<div class="detail" id="detail" role="dialog" aria-label="জায়গার বিস্তাব"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const BN = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const bn = (s) => String(s).replace(/[0-9]/g, d => BN[+d]);
  const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

  const CATS = {
    pharma:{label:"ফার্মেসি", short:"ফার্মেসি", color:"#34d399", icon:"pill"},
    hosp:{label:"হাসপাতাল ইমার্জেন্সি", short:"হাসপাতাল", color:"#f87171", icon:"cross"},
    diag:{label:"২৪ঘ ডায়াগনস্টিক", short:"ডায়াগনস্টিক", color:"#a78bfa", icon:"microscope"},
    fuel:{label:"ফুয়েল / CNG", short:"ফুয়েল", color:"#fb923c", icon:"fuel"},

  const byId = {};
  PLACES.forEach(p => byId[p.id] = p);

  const state = {
    q:"", cat:null, openOnly:true, sort:"dist", sel:null, detailOpen:false,
    routeTo:null, reported:{},
    myLat:23.7473, myLng:90.3753   /* ডেমো লোকেশন — ধানমন্ডি */
  };
  const isMobile = () => window.matchMedia("(max-width:880px)").matches;

  function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function isOpen(p, now){
    if(p.h24) return true;
    return p.hours.some(([o,c]) => o < c ? (now >= o && now < c) : (now >= o || now < c));
  }
  function bnTime(min){
    min = ((min % 1440) + 1440) % 1440;
    const h = Math.floor(min/60), m = min % 60;
    const per = h < 4 ? "রাত" : h < 6 ? "ভোর" : h < 12 ? "সকাল" : h < 16 ? "দুপুর" : h < 18 ? "বিকেল" : h < 19 ? "সন্ধ্যা" : "রাত";
    let hh = h % 12; if(hh === 0) hh = 12;
    return per + " " + bn(hh) + (m ? ":" + bn(String(m).padStart(2,"0")) : "") + "টা";
  }
  function hoursLabel(p){
    if(p.h24) return "২৪ ঘণ্টা";
    const [o,c] = p.hours[0];
    return bnTime(o) + " – " + bnTime(c);
  }
  function statusOf(p){
    const now = nowMin();
    if(state.reported[p.id]) return {cls:"st-warn", text:"রিপোর্ট করা হয়েছে · ৪৮ ঘণ্টায় রি-ভেরিফিকেশন"};
    if(isOpen(p, now)){
      if(p.h24) return {cls:"st-open", text:"২৪ ঘণ্টা খোলা"};
      const [,c] = p.hours[0];
      return {cls:"st-open", text:"এখন খোলা · " + bnTime(c) + " পর্যন্ত"};
    }
    const [o] = p.hours[0];
    const when = now < o ? bnTime(o) + "য় খুলবে" : "আগামীকাল " + bnTime(o) + "য় খুলবে";
    return {cls:"st-closed", text:"এখন বন্ধ · " + when};
  }
  function verLabel(p){
    const n = p.ver;
    if(n === 0) return "আজ";
    if(n === 1) return "গতকাল";
    if(n < 30) return bn(n) + " দিন আগে";
    return bn(Math.round(n/30)) + " মাস আগে";
  }
  function distKm(p){
    const R = 6371, r = Math.PI/180;
    const dLat = (p.lat - state.myLat)*r, dLng = (p.lng - state.myLng)*r;
    const a = Math.sin(dLat/2)**2 + Math.cos(state.myLat*r)*Math.cos(p.lat*r)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function fmtKm(km){ return (km < 1 ? bn((km*1000).toFixed(0)) + " মি." : bn(km.toFixed(1)) + " কি.মি."); }
  function matches(p){
    if(state.cat && p.cat !== state.cat) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      if(!(p.name.toLowerCase().includes(q) || p.area.toLowerCase().includes(q))) return false;
    }
    if(state.openOnly && !isOpen(p, nowMin())) return false;
    return true;
  }
  function visibleSorted(){
    const vis = PLACES.filter(matches);
    vis.sort((a,b) => state.sort === "dist" ? distKm(a) - distKm(b) : a.ver - b.ver);

  }

  /* ---------- toast ---------- */

  /* ---------- map ---------- */
  let map, markers = {}, meMarker, routeLine;

  /* টাইল সার্ভার ফলব্যাক — প্রথমে OSM (ডিটেইলসহ), ব্লক/ডাউন হলে পরেরগুলো, সব ফেল করলে পরিষ্কার বার্তা */
  const TILE_SOURCES = [
    { url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      maxNativeZoom:19,
      attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> অবদানকারীগণ', filter:true },
    { url:"https://tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
      maxNativeZoom:19,
      attr:'&copy; OpenStreetMap France', filter:true },
    { url:"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      overlay:"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
      maxNativeZoom:16,
      attr:'Tiles &copy; <a href="https://www.esri.com">Esri</a> — Esri, HERE, Garmin, FAO, USGS' },
    { url:"https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png",
      maxNativeZoom:19,
      attr:'&copy; OpenStreetMap অবদানকারীগণ · Wikimedia Maps', filter:true }
  ];
  let tileLayer = null, labelLayer = null, tileSrc = 0, tileErr = 0, tileOk = 0, rotTimer = null;
  function addTiles(){
    const s = TILE_SOURCES[tileSrc];
    tileErr = 0; tileOk = 0;
    map.getContainer().classList.toggle("rj-osmfilter", !!s.filter);
    const rotate = () => {
      tileSrc++;
      try{ if(tileLayer) map.removeLayer(tileLayer); if(labelLayer) map.removeLayer(labelLayer); }catch(e){}
      if(tileSrc < TILE_SOURCES.length){
        toast("ম্যাপ সার্ভার ব্লকড — ফলব্যাক সার্ভারে স্যুইচ করা হয়েছে।");
        addTiles();
      } else {
        const el = document.getElementById("mapfail");
        if(el) el.classList.add("show");
      }
    };
    const fail = () => { tileErr++; if(tileErr >= 4 && tileOk === 0) rotate(); };
    const ok = () => { tileOk++; if(tileOk >= 2 && rotTimer){ clearTimeout(rotTimer); rotTimer = null; } };
    tileLayer = L.tileLayer(s.url, { maxZoom:19, maxNativeZoom:(s.maxNativeZoom||19), attribution:s.attr });
    tileLayer.on("tileerror", fail);
    tileLayer.on("tileload", ok);
    tileLayer.addTo(map);
    if(s.overlay){
      labelLayer = L.tileLayer(s.overlay, { maxZoom:19, maxNativeZoom:(s.maxNativeZoom||19), opacity:.9, attribution:"" });
      labelLayer.on("tileerror", fail);
      labelLayer.on("tileload", ok);
      labelLayer.addTo(map);
    }
    if(rotTimer) clearTimeout(rotTimer);
    rotTimer = setTimeout(() => { if(tileOk === 0) rotate(); }, 6000);
  }
  function mkHTML(p){
    return '<div class="mk" data-id="' + p.id + '" style="--c:' + CATS[p.cat].color + '"><i data-lucide="' + CATS[p.cat].icon + '"></i></div>';
  }
  function initMap(){
    map = L.map("map", { zoomControl:true, attributionControl:true }).setView([23.758, 90.386], 13);
    addTiles();
    PLACES.forEach(p => {
      const m = L.marker([p.lat, p.lng], {
        icon: L.divIcon({ className:"", html:mkHTML(p), iconSize:[30,30], iconAnchor:[15,15] }),
        keyboard:true, title:p.name
      }).addTo(map);
      m.on("click", () => select(p.id, { pan:false }));
      markers[p.id] = m;
    });
    meMarker = L.marker([state.myLat, state.myLng], {

  function refreshMarkerStates(){
    const now = nowMin();

      const el = markers[p.id].getElement();

      if(!mk) return;
      mk.classList.toggle("is-sel", state.sel === p.id);

      el.style.display = matches(p) ? "" : "none";

  /* ---------- selection & detail ---------- */
  function renderDetail(){
    const box = $("detail");

    if(p.ver >= 90) hist.push('<span><i data-lucide="history"></i>৩ মাস+ যাচাই হয়নি — “পুরনো” চিহ্নিত</span>');

    box.innerHTML =

      '<div class="dkv"><i data-lucide="clock"></i><span>খোলার সময়: ' + hoursLabel(p) + '</span></div>' +
      '<a class="dcall" href="tel:' + p.phone.replace(/[^0-9+]/g,"") + '"><i data-lucide="phone"></i>কল করুন · ' + bn(p.phone) + '</a>' +
      '<a class="ddir" href="' + gmaps + '" target="_blank" rel="noopener noreferrer" data-act="dirlink" data-id="' + p.id + '"><i data-lucide="navigation"></i>আমার লোকেশন থেকে দিক দেখান</a>' +
      '<div class="drow">' +
        '<button type="button" data-act="share" data-id="' + p.id + '"><i data-lucide="share-2"></i>শেয়ার</button>' +
        '<button type="button" data-act="report" data-id="' + p.id + '"><i data-lucide="alert-triangle"></i>বন্ধ দেখাচ্ছে?</button>' +
      '</div>' +
      '<div class="dhist">' + hist.join("") + '</div>';
    box.classList.toggle("show", !!(state.sel && state.detailOpen));
    icons();
  }
  function select(id, opts){
    const p = byId[id];
    if(!p) return;
    state.sel = id;
    state.detailOpen = true;
    try { history.replaceState(null, "", "#" + id); } catch(e){}
    renderList();
    renderDetail();
    refreshMarkerStates();
    $("seclab").innerHTML = state.sort === "dist" ? "কাছাকাছি — দূরত্ব অনুযায়ী · <b>" + bn(visibleSorted().length) + "টি</b>" : "সাম্প্রতিক যাচাই আগে · <b>" + bn(visibleSorted().length) + "টি</b>";
    if(opts && opts.pan && map){
      const ll = [p.lat, p.lng];
      if(!map.getBounds().pad(-0.15).contains(ll)) map.panTo(ll);
    }
  }

  /* ---------- filters refresh ---------- */
  function refreshAll(){
    const vis = visibleSorted();
    if(!state.sel || !vis.some(p => p.id === state.sel)){
      state.sel = vis.length ? vis[0].id : null;   /* ক্লিকের পরেও ডিটেইল সবসময় দৃশ্যমান তালিকার সাথে মিলবে */
    }
    if(!isMobile()) state.detailOpen = !!state.sel;   /* ডেস্কটপে প্যানেল সবসময় খোলা; মোবাইলে শুধু ট্যাপ করলে */
    renderChips();
    renderList();
    renderDetail();
    refreshMarkerStates();
    const n = PLACES.filter(p => isOpen(p, nowMin())).length;
    $("openCount").textContent = bn(n);
    $("seclab").innerHTML = state.sort === "dist" ? "কাছাকাছি — দূরত্ব অনুযায়ী · <b>" + bn(vis.length) + "টি</b>" : "সাম্প্রতিক যাচাই আগে · <b>" + bn(vis.length) + "টি</b>";
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === state.sort ? "true" : "false"));
    drawRoute(state.routeTo ? byId[state.routeTo] : null);
  }

  /* ---------- events ---------- */
  $("q").addEventListener("input", e => { state.q = e.target.value.trim(); refreshAll(); });
  $("openOnly").addEventListener("change", e => { state.openOnly = e.target.checked; refreshAll(); });
  $("catrail").addEventListener("click", e => {
    const chip = e.target.closest(".cat-chip");
    if(!chip) return;
    state.cat = state.cat === chip.dataset.cat ? null : chip.dataset.cat;
    refreshAll();
  });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    state.sort = b.dataset.sort; refreshAll();
  }));

  $("list").addEventListener("click", e => {
    const showAll = e.target.closest('[data-act="showall"]');
    if(showAll){
      state.openOnly = false;
      $("openOnly").checked = false;
      refreshAll();
      return;
    }
    const btn = e.target.closest("button[data-act], a");
    const card = e.target.closest(".card");
    if(btn){
      e.stopPropagation();
      const id = btn.dataset.id;
      if(btn.tagName === "A"){ toast("📞 কল যাচ্ছে… (" + bn(byId[id].phone) + ")"); return; }
      if(btn.dataset.act === "dir"){
        state.routeTo = state.routeTo === id ? null : id;
        select(id, { pan:true });
        toast(state.routeTo ? "🗺 ম্যাপে নীল দাগা — আপনার লোকেশন থেকে রুট। “বিস্তাব”-এ গুগল ম্যাপ লিংকও আছে।" : "রুট মুছে ফেলা হয়েছে।");
      } else if(btn.dataset.act === "report"){
        state.reported[id] = true;
        toast("রিপোর্ট জমা হয়েছে — ৪৮ ঘণ্টার মধ্যে রি-ভেরিফিকেশন হবে। ধন্যবাদ!");
        refreshAll();
      } else if(btn.dataset.act === "share"){
        share(byId[id]);
      }
      return;
    }
    if(card && card.dataset.id){ select(card.dataset.id, { pan:true }); }
  });

  function share(p){
    const url = location.origin === "null" ? "" : location.origin + location.pathname + "#" + p.id;
    const text = p.name + " — রাতজাগা";
    if(navigator.share){
      navigator.share({ title:text, text:text, url:url || undefined }).catch(() => {});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText((text + " " + url).trim()).then(
        () => toast("শেয়ার লিংক কপি হয়েছে।"),
        () => toast("শেয়ার করা যায়নি।")
      );
    } else toast("শেয়ার এই ব্রাউজারে সমর্থিত নয়।");
  }

  $("detail").addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const id = el.dataset.id;
    if(el.dataset.act === "dclose"){ state.detailOpen = false; renderDetail(); }
    else if(el.dataset.act === "report"){
      state.reported[id] = true;
      toast("রিপোর্ট জমা হয়েছে — ৪৮ ঘণ্টার মধ্যে রি-ভেরিফিকেশন হবে।");
      refreshAll();
    } else if(el.dataset.act === "share"){ share(byId[id]); }
    else if(el.dataset.act === "dirlink"){
      state.routeTo = id;
      drawRoute(byId[id]);
      toast("নতুন ট্যাবে গুগল ম্যাপ খুলছে — আর ম্যাপে ডেমো রুট দেখানো হলো।");
    }
  });

  $("locbtn").addEventListener("click", () => {
    if(!navigator.geolocation){ toast("এই ব্রাউজারে GPS নেই — ডেমো লোকেশন ব্যবহার হচ্ছে।"); return; }
    toast("আপনার লোকেশন নেওয়া হচ্ছে…");
    navigator.geolocation.getCurrentPosition(pos => {
      state.myLat = pos.coords.latitude; state.myLng = pos.coords.longitude;
      meMarker.setLatLng([state.myLat, state.myLng]);
      refreshAll();
      map.panTo([state.myLat, state.myLng]);
      toast("লোকেশন আপডেট হয়েছে — দূরত্ব ও সাজানো নতুন করে হিসাব হয়েছে।");
    }, () => toast("লোকেশন পাওয়া যায়নি — ডেমো লোকেশন (ধানমন্ডি) ব্যবহার হচ্ছে।"), { timeout:6000 });
  });

  document.querySelectorAll("[data-toast]").forEach(el => el.addEventListener("click", () => toast(el.dataset.toast)));

  /* nav + mobile tabs */
  function setView(v){
    document.body.dataset.view = v;
    document.querySelectorAll(".nav [data-nav]").forEach(b => b.setAttribute("aria-pressed", b.dataset.nav === v ? "true" : "false"));
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === v ? "true" : "false"));
    if(v === "map" && map) setTimeout(() => map.invalidateSize(), 60);
  }
  document.querySelectorAll(".nav [data-nav]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.nav;
    if(v === "saved") return toast("সেভ করা জায়গা — কমিউনিটি ফেজে আসছে।");
    if(v === "reports") return toast("আমার রিপোর্ট — কমিউনিটি ফেজে আসছে।");
    setView(v);
  }));
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.tab)));

  /* keyboard: "/" দিয়ে সার্চ */
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement && document.activeElement.tagName !== "INPUT"){
      e.preventDefault(); $("q").focus();
    }
  });

  /* ---------- init ---------- */
  renderChips();
  const hashId = location.hash.replace("#","");
  state.sel = (hashId && byId[hashId]) ? hashId : null;
  initMap();
  refreshAll();
  if(state.sel && !isMobile()) select(state.sel, { pan:false });
  icons();
})();
</script>
</body>
</html>
